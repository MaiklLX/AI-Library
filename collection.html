<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111116"><meta name="description" content="Страница коллекции AI Library: состав книг, статусы публикации и информация об издании.">
<title>Коллекция · AI Library</title>
<style>
:root{color-scheme:dark;--bg:#101014;--panel:#19191f;--line:rgba(215,185,123,.22);--gold:#d8b978;--muted:#aaa49a;--ink:#f4efe5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#30291e 0,transparent 48%),var(--bg);color:var(--ink);font:16px/1.65 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit}.wrap{width:min(1120px,calc(100% - 36px));margin:auto}.topbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;background:#101014eF;border-bottom:1px solid #d8b97820;backdrop-filter:blur(12px)}.back{color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:13px}.brand,.eyebrow{color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase}.hero{display:grid;grid-template-columns:1fr minmax(180px,290px);gap:clamp(28px,6vw,70px);align-items:center;padding:48px 0 38px}.hero h1{font:500 clamp(40px,7vw,72px)/1.02 Georgia,serif;letter-spacing:-.035em;margin:14px 0}.subtitle{color:var(--gold);font-size:18px}.lead{max-width:700px;color:#d0cbc2;font-size:16px}.cover{width:100%;max-width:290px;justify-self:center;border-radius:6px;box-shadow:0 24px 50px #0009}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.meta span{border:1px solid var(--line);border-radius:99px;padding:5px 11px;color:#d9cba9;font-size:11px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.btn,.action{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border:1px solid var(--gold);border-radius:8px;text-decoration:none;color:var(--gold);font-size:12px}.btn.primary{background:#d8b97818}.section-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:22px 0 18px}.section-head h2{font:500 clamp(26px,4vw,38px)/1.1 Georgia,serif;margin:0}.section-head p{color:var(--muted);font-size:13px;margin:0}.volumes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.volume{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:linear-gradient(155deg,#222127,#15151a);box-shadow:0 14px 34px #0003}.volume-cover{display:block;width:100%;aspect-ratio:2/3;object-fit:cover}.volume-body{padding:17px 18px 19px}.volume-top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--gold);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.status{border:1px solid #d8b97838;border-radius:99px;padding:4px 7px;font-size:9px;white-space:nowrap}.volume h3{font:500 23px/1.12 Georgia,serif;margin:13px 0 8px}.range{color:#9b9489;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.volume-info{color:#c1bbb1;font-size:13px;line-height:1.55;min-height:4.4em}.locked,.countdown{margin-top:15px;padding:12px;border:1px solid #d8b97824;border-radius:9px;color:#c9b98f;font-size:11px}.locked{display:flex;gap:9px;align-items:center}.lock{font-size:19px}.countdown-units{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}.countdown-unit{text-align:center;border-right:1px solid #d8b97820}.countdown-unit:last-child{border:0}.countdown-unit strong{display:block;font:22px Georgia,serif;color:#f2e6cf}.countdown-unit span{font-size:8px;color:#999084}.volume-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:15px}.state{font-size:10px;color:#c8b17d;letter-spacing:.1em}.action[aria-disabled=true]{border-color:#514d45;color:#89847b}.note{margin:30px 0 48px;padding:18px 20px;border:1px solid var(--line);border-radius:12px;color:#bcb6aa;font-size:13px}.note strong{color:#e2d3b1}footer{padding:22px 0 34px;border-top:1px solid var(--line);color:#77736d;font-size:12px}footer a{color:var(--gold);text-decoration:none}
@media(max-width:850px){.volumes{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr 220px}}@media(max-width:600px){.wrap{width:calc(100% - 26px)}.topbar{align-items:flex-start}.brand{font-size:9px;text-align:right}.hero{grid-template-columns:1fr;padding:25px 0}.cover{grid-row:1;max-width:190px}.hero-copy{grid-row:2}.volumes{grid-template-columns:1fr}.volume{display:grid;grid-template-columns:112px minmax(0,1fr)}.volume-cover{height:100%;aspect-ratio:auto}.volume-body{padding:13px}.volume h3{font-size:20px}.volume-info{min-height:0;font-size:12px}.volume-top{align-items:flex-start;flex-direction:column}.volume-foot{align-items:flex-start;flex-direction:column}.section-head{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><div class="wrap">
<header class="topbar"><a class="back" href="./index.html#catalog">← На книжную полку</a><div class="brand">AI Library / Коллекция</div></header>
<main>
<section class="hero" aria-labelledby="collectionTitle"><div class="hero-copy"><div class="eyebrow" id="eyebrow">Особое издание</div><h1 id="collectionTitle">Коллекция</h1><div class="subtitle" id="subtitle"></div><p class="lead" id="description"></p><div class="meta" id="meta"></div><div class="actions" id="actions"></div></div><img class="cover" id="cover" alt=""></section>
<section aria-labelledby="volumesTitle"><div class="section-head"><h2 id="volumesTitle">Состав издания</h2><p id="sectionDescription"></p></div><div class="volumes" id="volumeList" aria-live="polite"></div></section>
<aside class="note" id="note"></aside>
</main><footer><a href="./index.html">AI Library</a> · Страница коллекции · Полный текст открывается только после официальной публикации.</footer>
</div>
<script>
(async()=>{
 const id=new URLSearchParams(location.search).get('id');
 const allowed=new Set(['ty-v-moih-planah','poka-nas-ne-naydut']);
 const $=name=>document.getElementById(name);
 const text=(node,value)=>{node.textContent=value||'';};
 if(!allowed.has(id)){text($('collectionTitle'),'Коллекция не найдена');text($('description'),'Вернитесь на книжную полку и выберите доступное издание.');return;}
 let data;
 try{const response=await fetch('./content/series/'+encodeURIComponent(id)+'.json',{cache:'no-cache'});if(!response.ok)throw Error('manifest');data=await response.json();}catch{ text($('collectionTitle'),'Коллекция временно недоступна');text($('description'),'Подключитесь к интернету и обновите страницу.');return;}
 if(!data||data.id!==id||data.type!=='series'||!Array.isArray(data.volumes)||!data.volumes.length){text($('collectionTitle'),'Не удалось загрузить состав издания');return;}
 document.title=data.title+' · AI Library';text($('eyebrow'),data.eyebrow||'Коллекция · AI Library');text($('collectionTitle'),data.title);text($('subtitle'),data.subtitle);text($('description'),data.description);text($('sectionDescription'),data.editorialNote);
 $('cover').src=data.cover;$('cover').alt='Обложка издания «'+data.title+'»';
 (data.genres||[data.genre,data.ageRating].filter(Boolean)).forEach(label=>{const chip=document.createElement('span');chip.textContent=label;$('meta').appendChild(chip);});
 const back=document.createElement('a');back.className='btn';back.href='./index.html#catalog';back.textContent='На книжную полку';$('actions').appendChild(back);
 if(data.premiereUrl){const a=document.createElement('a');a.className='btn primary';a.href=data.premiereUrl;a.textContent=data.premiereLabel||'О премьере';$('actions').prepend(a);}
 const catalog=await fetch('./content/catalog.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null);
 const entries=Array.isArray(catalog?.books)?catalog.books:[];
 const labels={planned:'Готовится',prerelease:'Премьера закрыта',published:'Новинка',scheduled:'Скоро выпуск'};
 const pad=n=>String(n).padStart(2,'0');const dateFmt=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric',timeZone:'Europe/Moscow'});const timers=[];
 data.volumes.forEach(volume=>{
  const card=document.createElement('article');card.className='volume';
  if(volume.cover){const img=document.createElement('img');img.className='volume-cover';img.loading='lazy';img.src=volume.cover;img.alt='Обложка '+(volume.title||('книги '+volume.number));card.appendChild(img);}
  const body=document.createElement('div');body.className='volume-body';const top=document.createElement('div');top.className='volume-top';
  const number=document.createElement('span');number.textContent=volume.label||('ЧАСТЬ '+pad(volume.number));const status=document.createElement('span');status.className='status';status.textContent=labels[volume.status]||'Статус уточняется';top.append(number,status);
  const title=document.createElement('h3');title.textContent=volume.title||number.textContent;
  const range=document.createElement('div');range.className='range';range.textContent=volume.rangeLabel||(volume.chapters?'ГЛАВЫ '+volume.chapters.from+'—'+volume.chapters.to:'');
  const desc=document.createElement('p');desc.className='volume-info';desc.textContent=volume.description||'Информация о книге будет добавлена отдельно.';
  const locked=document.createElement('div');locked.className='locked';locked.innerHTML='<span class="lock" aria-hidden="true">⌑</span>';const lockText=document.createElement('span');lockText.textContent=volume.lockedText||'Полный текст откроется после официальной публикации.';locked.appendChild(lockText);
  const bookId=volume.bookId||volume.id;const entry=entries.find(x=>x&&x.id===bookId&&x.metadataOnly===true&&Number(x.chapterCount)>0&&x.path==='./content/books/'+bookId+'.json'&&(x.status==='published'||(x.status==='scheduled'&&x.releaseAt===volume.releaseAt)));
  const release=volume.releaseAt?new Date(volume.releaseAt):null;const isPublished=!!entry&&(volume.status==='published'||(release&&!Number.isNaN(release.getTime())&&Date.now()>=release.getTime()));
  const foot=document.createElement('div');foot.className='volume-foot';const state=document.createElement('span');state.className='state';state.textContent=isPublished?'ДОСТУПЕН':(labels[volume.status]||'СТАТУС УТОЧНЯЕТСЯ');
  const action=document.createElement('a');action.className='action';
  if(isPublished){action.href='./index.html?book='+encodeURIComponent('published-'+bookId);action.textContent='Читать книгу';}
  else if(volume.status==='prerelease'&&volume.premiereBookId){action.href='./premiere.html?book='+encodeURIComponent(volume.premiereBookId);action.textContent='О премьере';}
  else{action.setAttribute('aria-disabled','true');action.textContent='Скоро';}
  foot.append(state,action);
  let countdown=null;
  if(volume.releaseAt&&!isPublished&&release&&!Number.isNaN(release.getTime())){countdown=document.createElement('div');countdown.className='countdown';const date=document.createElement('div');date.textContent='Плановый выпуск · '+dateFmt.format(release)+' · 18:00 МСК';const units=document.createElement('div');units.className='countdown-units';const nodes=[];['дн.','ч.','мин.','сек.'].forEach(caption=>{const unit=document.createElement('div');unit.className='countdown-unit';const strong=document.createElement('strong');strong.textContent='—';const small=document.createElement('span');small.textContent=caption;unit.append(strong,small);units.appendChild(unit);nodes.push(strong);});countdown.append(date,units);timers.push({release,nodes,entry,volume,action,state,status,bookId});}
  body.append(top,title,range,desc);if(countdown)body.appendChild(countdown);else body.appendChild(locked);body.appendChild(foot);card.appendChild(body);$('volumeList').appendChild(card);
 });
 const note=document.createElement('strong');note.textContent='О статусе издания. ';$('note').append(note,document.createTextNode(data.statusNote||'Карточки отражают состав и статус книг. Даты и доступность текста определяются только официальными данными каталога.'));
 function tick(){const now=Date.now();timers.forEach(t=>{let ms=t.release.getTime()-now;if(ms<=0){const opened=!!t.entry;if(opened){t.nodes.forEach(n=>n.textContent='00');t.action.href='./index.html?book='+encodeURIComponent('published-'+t.bookId);t.action.textContent='Читать книгу';t.action.removeAttribute('aria-disabled');t.state.textContent='ДОСТУПЕН';t.status.textContent='Новинка';}else{t.nodes.forEach(n=>n.textContent='—');}return;}const d=Math.floor(ms/86400000);ms%=86400000;const h=Math.floor(ms/3600000);ms%=3600000;const m=Math.floor(ms/60000);ms%=60000;const s=Math.floor(ms/1000);[d,h,m,s].forEach((n,i)=>t.nodes[i].textContent=pad(n));});}
 tick();if(timers.length)window.setInterval(tick,1000);
})().catch(()=>{document.getElementById('collectionTitle').textContent='Не удалось загрузить коллекцию';});
</script></body></html>
