name: Validate AI Library

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML scripts, manifest and local assets
        run: node scripts/validate.mjs
      - name: Test Service Worker offline fallbacks
        run: node scripts/test-service-worker.mjs
